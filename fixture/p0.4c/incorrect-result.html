  <body>
    <main>
      <h1>Incorrect result scenario</h1>
      <p id="result" aria-live="polite">Clicks: 0</p>
      <button id="increment" type="button">Increment</button>
    </main>
    <script>
      window.aegisqaActionCount = 0;
      document.getElementById("increment").addEventListener("click", function () {
        window.aegisqaActionCount += 1;
